apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-pages
  labels: {{- include "site.labels" . | nindent 4 }}
data:
{{- range $path, $_ := .Files.Glob "site/**" }}
  {{ include "site.key" $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
  labels: {{- include "site.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      server_tokens off;
      # behind the tunnel the pod sees http://<host>:8080: keep /privacy → /privacy/ redirects relative
      absolute_redirect off;
      charset utf-8;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      location / {
        try_files $uri $uri/ =404;
      }
      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }
    }
