# Static pages live in site/ (inside the chart so Helm can read them). Editing a page and pushing to main is the
# whole deploy: Argo CD syncs, the ConfigMap changes, the checksum annotation rolls the pods.
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27.5-alpine"
  pullPolicy: IfNotPresent

replicas: 1

ingress:
  enabled: true
  className: cloudflare-tunnel
  # No Cloudflare Access application on this host: the site is public (Google OAuth homepage / privacy policy).
  host: k8s.wanawata.com

resources:
  requests: { cpu: 10m, memory: 16Mi }
  limits: { memory: 64Mi }
